<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#F4F2E4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HFT build">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('hft_theme')==='dark'?'dark':'light')}catch(e){}</script>
<title>Sushant's HFT build tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2E4;--panel:#FFFEF7;--panel2:#ECE9D6;--ink:#111111;--dim:#5D5C4E;--line:#111111;
  --lime:#C7F431;--cyan:#56E2E7;--peach:#F9C9A2;--mint:#A8EEC7;--lav:#CFBFF8;--pink:#F5A9A6;--tape:#F6D200;--red:#E2362F;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#11120C;--panel:#1B1D13;--panel2:#262819;--ink:#F2F0E2;--dim:#A5A392;--line:#EDEBD9;}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11120C;--panel:#1B1D13;--panel2:#262819;--ink:#F2F0E2;--dim:#A5A392;--line:#EDEBD9;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.mono{font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dim{color:var(--dim)}
#app{max-width:520px;margin:0 auto}
button{font-family:inherit}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--cyan);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.sq{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0;cursor:pointer;font-weight:700;font-size:16px}
.sq[disabled]{opacity:.35;cursor:default}
.sq svg{width:18px;height:18px}
.sq .ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sync{font:700 10.5px 'Space Mono',monospace;padding:4px 9px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);white-space:nowrap;cursor:pointer}
.sync.ok{background:var(--mint);color:#111;border-color:#111}
.sync.saving{background:var(--tape);color:#111;border-color:#111}
.sync.err{background:var(--pink);color:#111;border-color:#111}
.page{padding:16px 16px 120px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:2px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-in{display:flex;gap:4px;max-width:520px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:2px solid transparent;border-radius:10px;background:none;color:var(--ink);font-size:10.5px;font-weight:500;cursor:pointer}
.nav button.on{background:var(--lime);border-color:#111;color:#111;font-weight:700}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* cards */
.card{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;scroll-margin-top:70px}
.card h2{margin:0 0 8px;font-size:16px;font-weight:700}
.card p{margin:0 0 8px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hz{padding-top:0;overflow:hidden}
.stripe{height:11px;margin:0 -14px 12px;background:repeating-linear-gradient(-45deg,var(--tape) 0 10px,#111 10px 20px);border-bottom:2px solid var(--line)}
.gate-card{border-width:3px}

/* pills */
.pill{display:inline-block;padding:2px 9px;border:1.5px solid #111;border-radius:999px;font:700 10.5px 'Space Mono',monospace;color:#111;background:var(--peach);white-space:nowrap}
.pill.cf{background:var(--peach)}.pill.z{background:var(--cyan)}.pill.p{background:var(--lav)}.pill.m{background:var(--mint)}
.pill.lime{background:var(--lime)}.pill.tape{background:var(--tape)}.pill.plain{background:var(--panel);color:var(--ink);border-color:var(--line)}

/* buttons */
.btn{font-weight:700;font-size:13.5px;color:#111;background:var(--lime);border:2px solid #111;border-radius:8px;padding:10px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0 0}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* hero */
.tape-wrap{overflow:hidden;margin:0 -16px 20px;padding:8px 0}
.tape{transform:rotate(-1.6deg);width:112%;margin-left:-6%;background:var(--tape);border-block:2px solid #111;color:#111;font:700 12px 'Space Mono',monospace;white-space:nowrap;overflow:hidden;padding:7px 0}
.tape span{display:inline-block;padding:0 12px}
.hero{position:relative;padding:4px 2px 18px}
.hero h2{margin:0 0 10px;font-size:38px;line-height:1.02;font-weight:700;letter-spacing:-.03em}
.hero p{margin:0 0 4px;max-width:34ch}
.spark{width:20px;height:20px;color:var(--ink)}
.hero .spark{position:absolute;right:6px;top:2px;width:44px;height:44px}

/* stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.stat b{display:block;font:700 24px 'Space Mono',monospace;line-height:1.1}
.stat span{font-size:11.5px;color:var(--dim)}
.bar{height:14px;border:2px solid var(--line);border-radius:7px;background:var(--panel2);overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--lime);border-right:2px solid #111}
.bar i[style*="width:0%"]{border-right:0}
.bl{display:flex;justify-content:space-between;font-size:13px}

/* checklist rows */
.mrow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1.5px dashed var(--line);cursor:pointer}
.mrow:first-of-type{border-top:0}
.mtxt{font-size:14px;padding-top:1px}
.mtxt.done{color:var(--dim);text-decoration:line-through}
.mrow .pill{margin-top:1px;min-width:74px;text-align:center}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;margin:0;border:2px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;display:grid;place-content:center}
.chk:checked{background:var(--lime);border-color:#111}
.chk:checked::after{content:"";width:6px;height:12px;border:solid #111;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* grade boxes (R / A / G) */
.grade{display:flex;gap:4px}
.gb{width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--line);border-radius:5px;font:700 11px 'Space Mono',monospace;color:var(--dim)}
.gb.on{color:#111;border-color:#111}
.gb.r.on{background:var(--pink)}.gb.a.on{background:var(--tape)}.gb.g.on{background:var(--lime)}

/* alerts */
.alert{border:2px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.alert .stripe{margin:0 0 10px}
.alert .body{padding:0 14px 12px}
.alert b{display:block;margin-bottom:4px}
.alert ul{margin:0;padding-left:18px}

/* log page */
.bars14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px}
.bars14 .cb{width:100%;min-height:4px;border:2px solid #111;border-radius:4px 4px 0 0;background:var(--cyan)}
.bars14 .cb.today{background:var(--lime)}
.bars14 .cb.zero{background:var(--panel2);border-color:var(--line)}
.lab14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:4px;font:400 9.5px 'Space Mono',monospace;color:var(--dim);text-align:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.field label{font-size:12.5px;color:var(--dim)}
.field input,.inline-in{font:700 15px 'Space Mono',monospace;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.rules{margin:0;padding-left:18px}
.rules li{margin-bottom:6px}

/* calendar */
.calctl{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calctl .pill{font-size:12.5px;padding:5px 16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dow{font:700 10px 'Space Mono',monospace;text-align:center;color:var(--dim);padding-bottom:2px}
.day{position:relative;aspect-ratio:1;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-weight:700;font-size:12.5px;padding:0;cursor:pointer}
.day.blank{border:0;background:none;cursor:default}
.day.cp{background:var(--cyan);color:#111;border-color:#111}
.day.gate{background:var(--lime)}
.day.today::after{content:"";position:absolute;inset:3px;border:2px solid var(--red);border-radius:50%}
.day.sel{outline:3px solid var(--ink);outline-offset:1px}
.day .dot{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ink)}
.day.cp .dot{background:#111}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin-bottom:14px}
.legend i{display:inline-block;width:12px;height:12px;border:1.5px solid var(--line);border-radius:3px;vertical-align:-2px;margin-right:5px}
.legend i.c{background:var(--cyan);border-color:#111}.legend i.g{background:var(--lime);border-color:#111}
.legend i.t{border:2px solid var(--red);border-radius:50%}.legend i.d{width:6px;height:6px;border-radius:50%;background:var(--ink);margin:0 8px 0 3px;vertical-align:1px}

/* roadmap */
.ph ul{margin:8px 0;padding-left:18px}.ph li{margin-bottom:5px}
.gaterow{margin-top:10px;padding:8px 10px;border:2px solid #111;border-radius:8px;background:var(--lime);color:#111;font-weight:700;font-size:13.5px}
.books{margin:0;padding-left:18px}.books li{margin-bottom:5px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
